name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/los-planning-v1]

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.26", python-version: "3.13" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.26", python-version: "3.13" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.26", python-version: "3.13" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.26", python-version: "3.13" }
      - run: uv sync --project services/api --extra test --frozen
      - run: uv run --project services/api --extra test pytest
      - run: uv run --project services/api --extra test ruff check services/api
      - run: uv run --project services/api --extra test mypy --config-file services/api/pyproject.toml services/api/src

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.26", python-version: "3.13" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.26", python-version: "3.13" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
